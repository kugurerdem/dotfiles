theme = "catppuccin_mocha_transparent"

[editor]
default-yank-register = "+"

[keys.normal]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
D = ["extend_to_line_end", "delete_selection"]

[keys.select]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
D = ["extend_to_line_end", "delete_selection"]
